worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # Global default cache key — close to the documented Nginx default,
    # used by Scenario 3 (scheme<->host cross-scheme collision).
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid any 30s;

    upstream backend_upstream {
        server backend:5000;
    }

    server {
        listen 80;
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        proxy_cache my_cache;
        add_header X-Cache $upstream_cache_status always;

        # ---------------------------------------------------------------
        # Scenario 3: scheme/host cross-scheme collision -> stored XSS
        # Uses the global default key above: "$scheme$host$request_uri"
        # ---------------------------------------------------------------
        location = / {
            add_header X-Debug-Key "scheme=$scheme host=$host uri=$request_uri (key=\$scheme\$host\$request_uri)" always;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        # ---------------------------------------------------------------
        # Scenarios 1, 2 and 4: URI <-> Accept header boundary injection.
        # Deliberately ambiguous custom key, no separators -- this is the
        # vulnerable pattern from the article:
        #   proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
        # ---------------------------------------------------------------
        location = /admin {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://backend_upstream;
        }

        location = /ad {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /home {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /h {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /anyendpoint {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /anyend {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /XY {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /XYZ {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location / {
            proxy_pass http://backend_upstream;
        }
    }
}
