worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # Global default cache key — close to the documented Nginx default,
    # used by Scenario 3 (scheme<->host cross-scheme collision).
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid any 30s;

    upstream backend_upstream {
        server backend:5000;
    }

    server {
        listen 80;
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        proxy_cache my_cache;
        # NOTE: nginx's add_header does NOT merge across contexts -- a
        # location that declares its own add_header stops inheriting ANY
        # add_header from this server block, this one included. Every
        # location below that sets X-Debug-Key must also repeat this
        # X-Cache line itself, or X-Cache silently disappears from that
        # location's responses. (This bit the lab for a while: every
        # scenario location was missing X-Cache until this was caught.)
        add_header X-Cache $upstream_cache_status always;

        # ---------------------------------------------------------------
        # Scenario 3: scheme/host cross-scheme collision -> stored XSS
        # Uses the global default key above: "$scheme$host$request_uri"
        # ---------------------------------------------------------------
        location = / {
            add_header X-Cache $upstream_cache_status always;
            add_header X-Debug-Key "scheme=$scheme host=$host uri=$request_uri (key=\$scheme\$host\$request_uri)" always;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        # ---------------------------------------------------------------
        # Scenarios 1, 2 and 4: URI <-> Accept header boundary injection.
        # Deliberately ambiguous custom key, no separators -- this is the
        # vulnerable pattern from the article:
        #   proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
        # ---------------------------------------------------------------
        location = /admin {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Cache $upstream_cache_status always;
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://backend_upstream;
        }

        location = /ad {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Cache $upstream_cache_status always;
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /home {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Cache $upstream_cache_status always;
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /h {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Cache $upstream_cache_status always;
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /anyendpoint {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Cache $upstream_cache_status always;
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /anyend {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Cache $upstream_cache_status always;
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /XY {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Cache $upstream_cache_status always;
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        location = /XYZ {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Cache $upstream_cache_status always;
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        # ---------------------------------------------------------------
        # General-purpose target for tool/ckinject's generic boundary
        # probe (--base-path /fuzz). A PREFIX location (no "="), so any
        # suffix after /fuzz still hits this block and the ambiguous key
        # above -- the scenario-specific locations above are exact-match
        # only and don't support arbitrary-suffix fuzzing. Paired with
        # the /fuzz<rest> route in lab/backend/app.py.
        # ---------------------------------------------------------------
        location /fuzz {
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_accept";
            add_header X-Cache $upstream_cache_status always;
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri is_args=$is_args args=$args accept=$http_accept" always;
            proxy_pass http://backend_upstream;
        }

        # ---------------------------------------------------------------
        # Target for `ckinject discover`: keys on one fragment from each
        # category it tests (a header, a cookie, a query param) so the
        # tool actually gets exercised across headers/cookies/params
        # against a real cache, not just the Python mock in tests/.
        # Everything else discover's default wordlists cover (e.g.
        # Accept-Language, a "theme" cookie, a "utm_source" param) is
        # deliberately left OUT of this key -- the point is a target
        # with both genuine positives and genuine negatives.
        #
        # Bonus: $http_accept$cookie_session$arg_lang is just as
        # unseparated as /fuzz's $uri$http_accept was -- this is also a
        # real header<->cookie<->query boundary collision target, e.g.:
        #   ckinject probe --target ... --base-path /discoverlab \
        #     --pair "header:Accept,cookie:session"
        # ---------------------------------------------------------------
        location = /discoverlab {
            proxy_cache_key "$scheme$proxy_host$uri$http_accept$cookie_session$arg_lang";
            add_header X-Cache $upstream_cache_status always;
            add_header X-Debug-Key "scheme=$scheme proxy_host=$proxy_host uri=$uri accept=$http_accept cookie_session=$cookie_session arg_lang=$arg_lang" always;
            proxy_pass http://backend_upstream;
        }

        location / {
            proxy_pass http://backend_upstream;
        }
    }
}
