services:
  backend:
    build: ./backend
    container_name: ck_backend
    expose:
      - "5000"

  nginx:
    build: ./nginx
    container_name: ck_nginx
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"

  edge-sim:
    build: ./edge-sim
    container_name: ck_edge_sim
    depends_on:
      - nginx
    environment:
      - ORIGIN_URL=http://nginx:80
    ports:
      - "9090:9090"
