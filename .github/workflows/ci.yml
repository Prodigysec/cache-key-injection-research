name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-ckinject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ckinject unit tests (no Docker needed)
        run: python -m pytest tests/ -v

  test-static-analysis-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned analysis tools
        run: pip install -r tool/static-analysis/requirements.txt

      - name: Test Semgrep rules with native annotations
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          # Explicit files avoid Semgrep 1.180.0 file-config/directory-target discovery failure.
          for fixture in tool/static-analysis/fixtures/native/semgrep-rules.{py,js,ts}; do
            semgrep --test --config tool/static-analysis/semgrep-rules.yml "$fixture"
          done

      - name: Test config linters
        run: python -m pytest tool/static-analysis/tests -q

  lint-nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway certs for the lint check
        run: |
          cd lab
          chmod +x scripts/*.sh
          ./scripts/gen-certs.sh

      - name: Syntax-check nginx.conf
        run: |
          # nginx -t resolves upstream hostnames and loads ssl_certificate
          # files at config-load time, not just syntax -- it needs
          # "backend" to resolve to *something* and the cert files to
          # exist, even though this standalone container never serves
          # traffic.
          docker run --rm \
            --add-host backend:127.0.0.1 \
            -v "${{ github.workspace }}/lab/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "${{ github.workspace }}/lab/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27 nginx -t

  lab-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate self-signed certs
        run: |
          cd lab
          chmod +x scripts/*.sh
          ./scripts/gen-certs.sh

      - name: Build and start the lab
        run: |
          cd lab
          docker compose up -d --build
          sleep 5

      - name: Seed admin cache and verify ACL-bypass collision (Scenario 1)
        run: |
          docker exec ck_nginx curl -s -H "Accept: */*" http://127.0.0.1:80/admin -o /dev/null
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: min*/*" http://localhost:8080/ad)
          echo "status=$STATUS"
          test "$STATUS" = "200"
          curl -s -H "Accept: min*/*" http://localhost:8080/ad | grep -q "Admin Dashboard"

      - name: Verify CPDoS collision (Scenario 2)
        run: |
          curl -s -H "Accept: ome2*/*" http://localhost:8080/h2 -o /dev/null || true
          curl -s -H "Accept: ome*/*" http://localhost:8080/h -o /dev/null
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: */*" http://localhost:8080/home)
          echo "status=$STATUS"
          test "$STATUS" = "404"

      - name: Verify /fuzz collides and ckinject detects it (generic probe target)
        run: |
          # Manual check that /fuzz itself collides, independent of the tool.
          # Note: curl silently drops a header written as "Name:" (nothing
          # after the colon) instead of sending it empty -- "Name;" is the
          # documented way to force an actually-empty header value.
          #
          # The cache buster goes in a header (X-Ck-Buster), NOT a query
          # parameter. This step originally used "?ckbuster=fx1" in the
          # query string, which sits physically BETWEEN $uri and
          # $http_accept in /fuzz's key formula -- that silently broke
          # this exact check (it's the same underlying bug fixed in
          # tool/ckinject/prober.py; see docs/02-reproduction-guide.md
          # and docs/04-testing-methodology.md for the full story).
          BASELINE=$(curl -s -H "Accept;" -H "X-Ck-Buster: fx1" "http://localhost:8080/fuzzabcdefghij")
          SHIFTED=$(curl -s -H "Accept: bcdefghij" -H "X-Ck-Buster: fx1" "http://localhost:8080/fuzza")
          echo "baseline=$BASELINE"
          echo "shifted=$SHIFTED"
          test "$BASELINE" = "$SHIFTED"

          # Now the real end-to-end check: does ckinject itself detect it?
          cd tool
          pip install -q -e .
          # ckinject exits 1 when it finds a collision (that's the
          # expected, desired outcome here) -- don't let the GH Actions
          # default `set -e` kill the step on that exit code.
          python -m ckinject.cli probe --target http://localhost:8080 --base-path /fuzz --output /tmp/ckinject-report.json || true
          python3 -c "
          import json
          results = json.load(open('/tmp/ckinject-report.json'))
          collided_pairs = {r['pair'] for r in results if r['collided']}
          print('Collided pairs:', collided_pairs)
          # /fuzz only keys on Accept (not Accept-Language/-Encoding/X-Test-Header),
          # so both the path and the query boundary against Accept should collide --
          # see docs/02-reproduction-guide.md for why.
          expected = {'path_suffix <-> header:Accept', 'query:ckprobe <-> header:Accept'}
          missing = expected - collided_pairs
          assert not missing, f'Expected collision(s) not detected: {missing}'
          "

      - name: Verify ckinject discover against /discoverlab (header + cookie + query keying)
        run: |
          cd tool
          # /discoverlab keys on Accept, the "session" cookie, and the
          # "lang" query param only -- Accept-Language, a "theme" cookie,
          # and "utm_source" are deliberately NOT keyed, so this exercises
          # discover's full breadth (header/cookie/query, both positive
          # and negative) against a real Nginx cache, not just the Python
          # mock in tests/.
          python -m ckinject.cli discover --target http://localhost:8080 --base-path /discoverlab \
            --no-default-wordlist \
            --extra-header Accept --extra-header Accept-Language \
            --extra-cookie session --extra-cookie theme \
            --extra-param lang --extra-param utm_source \
            --output /tmp/ckinject-discover-report.json
          python3 -c "
          import json
          results = json.load(open('/tmp/ckinject-discover-report.json'))
          by_fragment = {r['fragment']: r['keyed'] for r in results}
          print('Classifications:', by_fragment)
          expected = {
              'header:Accept': True, 'header:Accept-Language': False,
              'cookie:session': True, 'cookie:theme': False,
              'query:lang': True, 'query:utm_source': False,
          }
          wrong = {k: (by_fragment.get(k), v) for k, v in expected.items() if by_fragment.get(k) != v}
          assert not wrong, f'Misclassified (got, expected): {wrong}'
          "

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f lab/docker-compose.yml logs

      - name: Tear down
        if: always()
        run: |
          cd lab
          docker compose down -v