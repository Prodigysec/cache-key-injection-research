name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-ckinject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ckinject unit tests (no Docker needed)
        run: python -m pytest tests/ -v

  test-static-analysis-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Validate semgrep-rules.yml against fixtures
        run: |
          cd tool/static-analysis
          python3 check_fixtures.py

  lint-nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway certs for the lint check
        run: |
          cd lab
          chmod +x scripts/*.sh
          ./scripts/gen-certs.sh

      - name: Syntax-check nginx.conf
        run: |
          # nginx -t resolves upstream hostnames and loads ssl_certificate
          # files at config-load time, not just syntax -- it needs
          # "backend" to resolve to *something* and the cert files to
          # exist, even though this standalone container never serves
          # traffic.
          docker run --rm \
            --add-host backend:127.0.0.1 \
            -v "${{ github.workspace }}/lab/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "${{ github.workspace }}/lab/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27 nginx -t

  lab-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate self-signed certs
        run: |
          cd lab
          chmod +x scripts/*.sh
          ./scripts/gen-certs.sh

      - name: Build and start the lab
        run: |
          cd lab
          docker compose up -d --build
          sleep 5

      - name: Seed admin cache and verify ACL-bypass collision (Scenario 1)
        run: |
          docker exec ck_nginx curl -s -H "Accept: */*" http://127.0.0.1:80/admin -o /dev/null
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: min*/*" http://localhost:8080/ad)
          echo "status=$STATUS"
          test "$STATUS" = "200"
          curl -s -H "Accept: min*/*" http://localhost:8080/ad | grep -q "Admin Dashboard"

      - name: Verify CPDoS collision (Scenario 2)
        run: |
          curl -s -H "Accept: ome2*/*" http://localhost:8080/h2 -o /dev/null || true
          curl -s -H "Accept: ome*/*" http://localhost:8080/h -o /dev/null
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: */*" http://localhost:8080/home)
          echo "status=$STATUS"
          test "$STATUS" = "404"

      - name: Verify /fuzz collides and ckinject detects it (generic probe target)
        run: |
          # Manual check that /fuzz itself collides, independent of the tool.
          # Note: curl silently drops a header written as "Name:" (nothing
          # after the colon) instead of sending it empty -- "Name;" is the
          # documented way to force an actually-empty header value.
          BASELINE=$(curl -s -H "Accept;" "http://localhost:8080/fuzzabcdefghij?ckbuster=fx1")
          SHIFTED=$(curl -s -H "Accept: bcdefghij" "http://localhost:8080/fuzza?ckbuster=fx1")
          echo "baseline=$BASELINE"
          echo "shifted=$SHIFTED"
          test "$BASELINE" = "$SHIFTED"

          # Now the real end-to-end check: does ckinject itself detect it?
          cd tool
          pip install -q -e .
          # ckinject exits 1 when it finds a collision (that's the
          # expected, desired outcome here) -- don't let the GH Actions
          # default `set -e` kill the step on that exit code.
          python -m ckinject.cli probe --target http://localhost:8080 --base-path /fuzz --output /tmp/ckinject-report.json || true
          python3 -c "
          import json
          results = json.load(open('/tmp/ckinject-report.json'))
          collided_pairs = {r['pair'] for r in results if r['collided']}
          print('Collided pairs:', collided_pairs)
          expected = {'path_suffix <-> header:Accept'}
          missing = expected - collided_pairs
          assert not missing, f'Expected collision(s) not detected: {missing}'
          "

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f lab/docker-compose.yml logs

      - name: Tear down
        if: always()
        run: |
          cd lab
          docker compose down -v