      "languages": [
        "python"
      ],
      "mode": "taint",
      "severity": "WARNING",
      "message": "Two request-derived operands reach a cache key through an unframed join. Static lead: verify distinct sources, variable lengths and sink use.",
      "pattern-sources": [
        {
          "pattern-either": [
            {
              "pattern": "request.path"
            },
            {
              "pattern": "request.full_path"
            },
            {
              "pattern": "request.url.path"
            },
            {
              "pattern": "request.headers.get(...)"
            },
            {
              "pattern": "request.headers[...]"
            },
            {
              "pattern": "request.GET.get(...)"
            },
            {
              "pattern": "request.GET[...]"
            },
            {
              "pattern": "request.args.get(...)"
            },
            {
              "pattern": "request.args[...]"
            },
            {
              "pattern": "request.cookies.get(...)"
            },
            {
              "pattern": "request.cookies[...]"
            },
            {
              "pattern": "request.query_params.get(...)"
            },
            {
              "pattern": "request.query_params[...]"
            }
          ],
          "label": "REQUEST",
          "exact": true
        },
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "$A + $B"
                },
                {
                  "pattern": "f\"...{$A}{$B}...\""
                }
              ]
            },
            {
              "pattern-not": "$A + $A"
            },
            {
              "pattern-not": "f\"...{$A}{$A}...\""
            },
            {
              "focus-metavariable": "$A"
            },
            {
              "pattern-not": "$A + \"...\" + $B"
            },
            {
              "pattern-not-regex": "\\+\\s*['\"]"
            }
          ],
          "requires": "REQUEST and not FRAGMENT_HASH",
          "label": "LEFT",
          "exact": true
        },
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "$A + $B"
                },
                {
                  "pattern": "f\"...{$A}{$B}...\""
                }
              ]
            },
            {
              "pattern-not": "$A + $A"
            },
            {
              "pattern-not": "f\"...{$A}{$A}...\""
            },
            {
              "focus-metavariable": "$B"
            },
            {
              "pattern-not": "$A + \"...\" + $B"
            },
            {
              "pattern-not-regex": "\\+\\s*['\"]"
            }
          ],
          "requires": "REQUEST and not FRAGMENT_HASH",
          "label": "RIGHT",
          "exact": true
        },
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "$A + $B"
                },
                {
                  "pattern": "f\"...{$A}{$B}...\""
                }
              ]
            },
            {
              "pattern-not": "$A + $A"
            },
            {
              "pattern-not": "f\"...{$A}{$A}...\""
            },
            {
              "pattern-not": "$A + \"...\" + $B"
            },
            {
              "pattern-not-regex": "\\+\\s*['\"]"
            }
          ],
          "requires": "LEFT and RIGHT and not FRAGMENT_HASH",
          "label": "JOIN",
          "exact": true
        },
        {
          "pattern-either": [
            {
              "pattern": "hashlib.sha256($X).hexdigest()"
            },
            {
              "pattern": "hashlib.sha256($X).digest()"
            },
            {
              "pattern": "hashlib.md5($X).hexdigest()"
            }
          ],
          "requires": "REQUEST and not JOIN",
          "label": "FRAGMENT_HASH",
          "exact": true
        }
      ],
      "pattern-sanitizers": [
        {
          "pattern-either": [
            {
              "pattern": "json.dumps([...])"
            },
            {
              "pattern": "json.dumps((...))"
            },
            {
              "pattern": "f\"{len($A)}:{$A}{len($B)}:{$B}\""
            }
          ],
          "exact": true
        },
        {
          "pattern": "urllib.parse.quote($A, safe=\"\") + \"|\" + urllib.parse.quote($B, safe=\"\")",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "$CACHE.get($KEY, ...)"
                },
                {
                  "pattern": "$CACHE.set($KEY, ...)"
                },
                {
                  "pattern": "$CACHE.delete($KEY, ...)"
                }
              ]
            },
            {
              "metavariable-regex": {
                "metavariable": "$CACHE",
                "regex": "(?i)^(.*cache.*|redis|memcached|client)$"
              }
            },
            {
              "focus-metavariable": "$KEY"
            }
          ],
          "requires": "JOIN"
        },
        {
          "patterns": [
            {
              "pattern-inside": "def $F(...):\n    ..."
            },
            {
              "metavariable-regex": {
                "metavariable": "$F",
                "regex": "^(make_cache_key|cache_key|key_func)$"
              }
            },
            {
              "pattern": "return $KEY"
            },
            {
              "focus-metavariable": "$KEY"
            }
          ],
          "requires": "JOIN"
        }
      ]
    },
