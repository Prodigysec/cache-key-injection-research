[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ckinject"
version = "0.1.0"
description = "Black-box cache key fragment discovery and boundary fuzzer (authorized testing only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
]

[project.scripts]
ckinject = "ckinject.cli:main"

[tool.setuptools]
packages = ["ckinject"]
